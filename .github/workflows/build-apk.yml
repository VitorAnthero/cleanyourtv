
name: AntheroTV - HDMI e data corrigidos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Personalizar interface TCL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = Path('launcher/app/src/main')
          source = base / 'java/com/gathin/tvhome/MainActivity.java'
          java = source.read_text(encoding='utf-8')

          # Fundo preto permanente, sem aura colorida.
          substitutions = [
              ('root.setBackgroundColor(cfg.backgroundColor);',
               'root.setBackgroundColor(Color.BLACK);'),
              ('if (cfg.wallpaper != null) showWallpaper(cfg.wallpaper);',
               '// Sem wallpaper; fundo preto fixo.'),
              ('ambient = findViewById(R.id.ambient);',
               'ambient = findViewById(R.id.ambient);\n        ambient.setVisibility(View.GONE);'),
          ]

          for old, new in substitutions:
              count = java.count(old)
              if count != 1:
                  raise SystemExit(f'ERRO: esperado um trecho ({count} encontrados): {old}')
              java = java.replace(old, new, 1)

          # Remover HDMI-CEC duplicado da contagem.
          hdmi_old = 'if (!info.isPassthroughInput() || info.getType() != TvInputInfo.TYPE_HDMI) continue;'
          hdmi_new = '''if (!info.isPassthroughInput() || info.getType() != TvInputInfo.TYPE_HDMI
                          || info.getParentId() != null) continue;
                CharSequence hdmiLabel = info.loadLabel(this);
                if (hdmiLabel != null && hdmiLabel.toString().toLowerCase(Locale.ROOT).contains("playstation")) continue;'''

          if java.count(hdmi_old) != 1:
              raise SystemExit('ERRO: lista fisica HDMI mudou no codigo-fonte')
          java = java.replace(hdmi_old, hdmi_new, 1)

          # Mostrar apenas as portas HDMI fisicas.
          entry_old = 'if (!info.isPassthroughInput()) continue;'
          entry_new = '''if (!info.isPassthroughInput()) continue;
                if (info.getType() == TvInputInfo.TYPE_HDMI) {
                    CharSequence hdmiLabel = info.loadLabel(this);
                    if (info.getParentId() != null
                            || (hdmiLabel != null && hdmiLabel.toString().toLowerCase(Locale.ROOT).contains("playstation"))) continue;
                }'''

          if java.count(entry_old) != 1:
              raise SystemExit('ERRO: rotina de listagem HDMI mudou no codigo-fonte')
          java = java.replace(entry_old, entry_new, 1)

          # Identificar o PS5 Pro na quarta entrada.
          label_old = 'if (hdmi && !label.toUpperCase(Locale.ROOT).contains("HDMI")) label = "HDMI " + label;'
          label_new = label_old + '\n                if (hdmi && label.trim().equalsIgnoreCase("HDMI 4")) label = "HDMI 4 - PS5 Pro";'

          if java.count(label_old) != 1:
              raise SystemExit('ERRO: nomeacao HDMI mudou no codigo-fonte')
          java = java.replace(label_old, label_new, 1)

          source.write_text(java, encoding='utf-8')

          # Traducao para portugues brasileiro.
          strings = base / 'res/values/strings.xml'
          tree = ET.parse(strings)

          traducoes = {
              'app_name': 'Início',
              'inputs': 'Entradas',
              'settings': 'Configurações',
              'choose_input': 'Selecionar entrada',
              'connected': 'Conectado',
              'standby': 'Em espera',
              'not_connected': 'Nenhum dispositivo',
              'live_tv': 'TV ao vivo',
              'no_inputs': 'Nenhuma entrada encontrada',
              'good_morning': 'Olá, Anthero',
              'good_afternoon': 'Olá, Anthero',
              'good_evening': 'Olá, Anthero',
              'good_night': 'Olá, Anthero',
              'ethernet': 'Rede cabeada',
              'offline': 'Sem conexão',
              'not_available': 'Não disponível nesta TV',
              'cant_open': 'Não foi possível abrir %1$s',
              'dream_name': 'Relógio',
              'vpn_off': 'VPN desligada',
              'home_settings': 'Tela inicial padrão',
              'home_settings_help': 'Escolha uma tela inicial nas configurações e pressione Home.',
              'home_key_name': 'Botão Início',
              'home_key_description': 'Faz o botão Início do controle abrir esta interface.',
              'input_key_service_description': 'Abre as entradas pelo botão do controle.',
              'card_prompt_title': 'Novo cartão de %1$s',
              'card_prompt_body': '%1$s pode mostrar um cartão na tela inicial. Mantê-lo oculto preserva o ícone normal.',
              'card_prompt_names': 'O cartão é %1$s. O aplicativo é %2$s.',
              'card_prompt_resigned': '%1$s foi atualizado com outra assinatura. Escolha novamente.',
              'card_prompt_relabelled': '%1$s mudou de nome. Escolha novamente.',
              'card_prompt_hint': 'Você pode alterar isso depois: segure OK em Configurações.',
              'card_prompt_identity': '%1$s, chave %2$s',
              'card_keep_hidden': 'Manter oculto',
              'card_show': 'Mostrar cartão',
              'card_not_saved': 'Não foi possível salvar a escolha',
              'module_cards': 'Cartões de módulos',
              'no_module_cards': 'Nenhum cartão de módulo instalado',
              'card_app_name': 'App: %1$s',
              'card_state_shown': 'Visível',
              'card_state_over_limit': 'Visível, acima do limite de 8',
              'card_state_hidden': 'Oculto',
              'card_state_new': 'Novo',
              'card_state_new_key': 'Nova chave',
              'card_state_new_label': 'Novo nome',
          }

          encontrados = set()

          for element in tree.getroot().findall('string'):
              key = element.get('name')
              if key in traducoes:
                  element.text = traducoes[key]
                  encontrados.add(key)

          ausentes = traducoes.keys() - encontrados
          if ausentes:
              raise SystemExit('Strings nao encontradas: ' + ', '.join(sorted(ausentes)))

          tree.write(strings, encoding='utf-8', xml_declaration=True)

          # Saudacao em caixa normal: Ola, Anthero.
          layout = base / 'res/layout/activity_main.xml'
          text = layout.read_text(encoding='utf-8')

          marker = 'android:id="@+id/greeting"'
          pos = text.find(marker)

          if pos < 0:
              raise SystemExit('Nao foi encontrado o TextView da saudacao')

          start = text.rfind('<TextView', 0, pos)
          end = text.find('/>', pos) + 2

          if start < 0 or end < 2:
              raise SystemExit('Nao foi possivel identificar o bloco da saudacao')

          trecho = text[start:end]

          if trecho.count('android:textAllCaps="true"') != 1:
              raise SystemExit('Esperada configuracao de caixa alta da saudacao')

          trecho_novo = trecho.replace(
              'android:textAllCaps="true"',
              'android:textAllCaps="false"'
          )

          # Mover data para uma linha completa.
          # Isso impede que OUTUBRO fique cortado.
          tree = ET.ElementTree(
              ET.fromstring(text[:start] + trecho_novo + text[end:])
          )

          android = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace(
              'android',
              'http://schemas.android.com/apk/res/android'
          )

          main = tree.getroot()

          content = next(
              (e for e in main if e.tag == 'LinearLayout'),
              None
          )

          if content is None:
              raise SystemExit('ERRO: conteudo principal do layout nao encontrado')

          header = next(
              (e for e in content if e.tag == 'RelativeLayout'),
              None
          )

          if header is None:
              raise SystemExit('ERRO: cabecalho do layout nao encontrado')

          left = next(
              (e for e in header
               if e.get(android + 'id') == '@+id/leftBlock'),
              None
          )

          if left is None:
              raise SystemExit('ERRO: bloco esquerdo nao encontrado')

          time_row = next(
              (e for e in left if e.tag == 'LinearLayout'),
              None
          )

          if time_row is None:
              raise SystemExit('ERRO: linha do relogio nao encontrada')

          date_column = next(
              (e for e in time_row
               if e.tag == 'LinearLayout'
               and any(
                   c.get(android + 'id') == '@+id/date'
                   for c in e
               )),
              None
          )

          if date_column is None:
              raise SystemExit('ERRO: coluna da data nao encontrada')

          time_row.remove(date_column)

          separator = next(
              (e for e in time_row
               if e.tag == 'View'
               and e.get(android + 'layout_width') == '1dp'),
              None
          )

          if separator is not None:
              time_row.remove(separator)

          date_column.set(
              android + 'layout_width',
              'match_parent'
          )
          date_column.attrib.pop(
              android + 'layout_weight',
              None
          )
          date_column.attrib.pop(
              android + 'layout_gravity',
              None
          )
          date_column.set(
              android + 'layout_marginTop',
              '2dp'
          )
          date_column.set(
              android + 'layout_marginBottom',
              '0dp'
          )

          date_view = next(
              e for e in date_column
              if e.get(android + 'id') == '@+id/date'
          )

          date_view.set(
              android + 'letterSpacing',
              '0.04'
          )

          content.insert(
              list(content).index(header) + 1,
              date_column
          )

          tree.write(
              layout,
              encoding='utf-8',
              xml_declaration=True
          )

          print('HDMI fisicas e data em linha completa configurados.')
          print('Personalizacoes aplicadas: saudacao, PT-BR, fundo preto.')
          print('Wi-Fi: o app ja suporta exibir o SSID; liberar localizacao apos instalar.')
          PY

      - name: Compilar APK
        working-directory: launcher
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AntheroTV-HDMI-Data-APK
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
